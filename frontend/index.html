<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>KnowHow Tool</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<svg class="sprite" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.2 12 4l9 7.2V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-5 4V5a1 1 0 0 1 1-1z"/></symbol>
  <symbol id="i-question" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 9 9 0 0 0-9-9zm0 16a1.25 1.25 0 1 1 0-2.5A1.25 1.25 0 0 1 12 19zm1.1-5.1v.6h-2.2v-1.1c0-1.35.65-2.05 1.65-2.72.8-.54 1.35-.95 1.35-1.75 0-.9-.7-1.48-1.8-1.48-1.05 0-1.85.48-2.65 1.42L8 7.35A5.2 5.2 0 0 1 12.2 5.4c2.45 0 4.05 1.35 4.05 3.4 0 1.7-.95 2.65-2.2 3.48-.65.44-.95.82-.95 1.62z"/></symbol>
  <symbol id="i-files" viewBox="0 0 24 24"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-knowledge" viewBox="0 0 24 24"><path d="M12 3 3 7.5 12 12l9-4.5zM3 12l9 4.5L21 12M3 16.5 12 21l9-4.5"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 12h14l-4.5-6L11 16l-2.5-3z"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm8 1.5V9h4.5z"/></symbol>
  <symbol id="i-template" viewBox="0 0 24 24"><path d="M4 4h16v5H4zM4 11h7v9H4zM13 11h7v9h-7z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5zm9 3.5-2.1-.6a7 7 0 0 0-.6-1.5l1-1.9-1.8-1.8-1.9 1a7 7 0 0 0-1.5-.6L13.5 4h-3l-.6 2.1a7 7 0 0 0-1.5.6l-1.9-1L4.7 7.5l1 1.9a7 7 0 0 0-.6 1.5L3 12v3l2.1.6c.15.53.35 1.03.6 1.5l-1 1.9 1.8 1.8 1.9-1c.47.25.97.45 1.5.6l.6 2.1h3l.6-2.1c.53-.15 1.03-.35 1.5-.6l1.9 1 1.8-1.8-1-1.9c.25-.47.45-.97.6-1.5L21 15z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 1 0 4.55 13.46l4.24 4.25 1.42-1.42-4.25-4.24A7.5 7.5 0 0 0 10.5 3zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M3 20.5 21 12 3 3.5 3 10l12 2-12 2z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><path d="M9 3h9a1 1 0 0 1 1 1v9h-2V5H9zM5 7h9a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4zM6 8h12l-1 12a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 16.5 15.3 5.2l3.5 3.5L7.5 20H4zM16.7 3.8l1.4-1.4a1 1 0 0 1 1.4 0l2.1 2.1a1 1 0 0 1 0 1.4l-1.4 1.4z"/></symbol>
  <symbol id="i-folder-open" viewBox="0 0 24 24"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h8a1 1 0 0 1 1 1v2H6.5L3 17z"/><path d="M6.8 11H22l-3 8H4z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zm8.2 5v2.2H9v1.6h2.2V17h1.6v-2.2H15v-1.6h-2.2V11z"/></symbol>
  <symbol id="i-archive" viewBox="0 0 24 24"><path d="M3 4h18v4H3zM4.5 9.5h15V20a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1zM9 12h6v1.7H9z"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 3h7v7h-2V6.4l-8.3 8.3-1.4-1.4L17.6 5H14zM5 5h5v2H6v11h11v-4h2v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l4 4v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm3 1v5h7V4zM7 13h10v7H7z"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="M16.5 6.5v9a4.5 4.5 0 0 1-9 0v-10a3 3 0 0 1 6 0v9.5a1.5 1.5 0 0 1-3 0V7h1.5v8a.5.5 0 0 0 1 0V5.5a2 2 0 0 0-4 0v10a3.5 3.5 0 0 0 7 0v-9z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm8 1.5V9h4.5zM8 12h8v1.6H8zm0 3h8v1.6H8z"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="M8.7 6.3 3 12l5.7 5.7 1.4-1.4L5.8 12l4.3-4.3zm6.6 0-1.4 1.4 4.3 4.3-4.3 4.3 1.4 1.4L21 12z"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><path d="M3 5h18v14H3zm12 1v12h5V6z"/></symbol>
</svg>

<div class="app" id="app">
  <header class="topbar">
    <a class="brand" href="#/dashboard" data-nav="dashboard">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__text">
        <strong id="brand-vault">KnowHow Tool</strong>
        <span class="brand__profile" id="brand-profile">Privat</span>
      </span>
    </a>

    <form class="omnisearch" id="omnisearch" role="search" autocomplete="off">
      <svg class="omnisearch__icon"><use href="#i-search"/></svg>
      <input type="search" id="omnisearch-input" placeholder="Notizen, Dateien und Chats durchsuchen" aria-label="Suche">
      <kbd class="omnisearch__hint">Strg K</kbd>
    </form>

    <div class="status-rail" id="status-rail" title="Lokaler Systemstatus">
      <button class="gauge" id="gauge-ollama" data-state="unknown" type="button">
        <span class="gauge__dot"></span>
        <span class="gauge__label">Ollama</span>
        <span class="gauge__value" id="gauge-ollama-value">prüfe…</span>
      </button>
      <button class="gauge" id="gauge-model" data-state="unknown" type="button">
        <span class="gauge__dot"></span>
        <span class="gauge__label">Modell</span>
        <span class="gauge__value" id="gauge-model-value">–</span>
      </button>
      <button class="gauge" id="gauge-vault" data-state="unknown" type="button">
        <span class="gauge__dot"></span>
        <span class="gauge__label">Vault</span>
        <span class="gauge__value" id="gauge-vault-value">–</span>
      </button>
      <span class="gauge gauge--static" id="gauge-offline" data-state="ok">
        <span class="gauge__dot"></span>
        <span class="gauge__label">Offline</span>
        <span class="gauge__value" id="gauge-offline-value">ein</span>
      </span>
    </div>

    <div class="topbar__actions">
      <button class="icon-btn" id="btn-theme" type="button" title="Design wechseln" aria-label="Design wechseln">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
      <button class="icon-btn" id="btn-context" type="button" title="Kontextspalte ein-/ausblenden" aria-label="Kontextspalte">
        <svg><use href="#i-panel"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" type="button" title="Einstellungen" aria-label="Einstellungen">
        <svg><use href="#i-gear"/></svg>
      </button>
    </div>
  </header>

  <div class="workspace" id="workspace">
    <nav class="rail" id="rail">
      <ul class="nav" id="nav">
        <li><button data-nav="dashboard" class="nav__item is-active"><svg><use href="#i-home"/></svg><span>Übersicht</span></button></li>
        <li><button data-nav="chat" class="nav__item"><svg><use href="#i-chat"/></svg><span>Wissen erweitern</span></button></li>
        <li><button data-nav="ask" class="nav__item"><svg><use href="#i-question"/></svg><span>Wissen fragen</span></button></li>
        <li><button data-nav="files" class="nav__item"><svg><use href="#i-files"/></svg><span>Dateien</span></button></li>
        <li><button data-nav="knowledge" class="nav__item"><svg><use href="#i-knowledge"/></svg><span>Wissen</span></button></li>
        <li><button data-nav="images" class="nav__item"><svg><use href="#i-image"/></svg><span>Bilder</span></button></li>
        <li><button data-nav="notes" class="nav__item"><svg><use href="#i-note"/></svg><span>Notizen</span></button></li>
        <li><button data-nav="templates" class="nav__item"><svg><use href="#i-template"/></svg><span>Vorlagen</span></button></li>
      </ul>
      <div class="rail__panel" id="rail-panel"></div>
      <footer class="rail-contact" aria-label="Produktversion">
        <span class="rail-contact__version">Version 1.1</span>
      </footer>
    </nav>

    <main class="main" id="main"></main>

    <aside class="context" id="context">
      <div class="context__inner" id="context-inner"></div>
    </aside>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal-root" id="modal-root" hidden></div>

<script type="module" src="/assets/js/app.js"></script>
</body>
</html>
